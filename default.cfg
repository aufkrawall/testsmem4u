# ============================================================================
# PHASE 6: Retention & Physical
# ============================================================================

[Test11]
# RefreshStable
# Each half is held untouched for 10000ms per polarity while the other half
# executes real write/verify tests. Both halves rotate through both polarities.
# Tests both the configured pattern AND its bitwise complement for comprehensive
# DRAM retention coverage. Retention failures can be pattern-dependent.
Enable=1
Time (%)=3
Function=RefreshStable
Pattern Mode=0
Pattern Param0=0xFFFFFFFFFFFFFFFF
Pattern Param1=0x0
Parameter=10000
Test Block Size (Mb)=0

[Test12]
Enable=1
Time (%)=1
Function=RowHammer
Pattern Mode=0
Pattern Param0=0x0
Pattern Param1=0x0
Parameter=0
Test Block Size (Mb)=0

# ============================================================================
# PHASE 7: LFSR & Advanced Moving Inversion
# ============================================================================

[Test14]
# LFSRPattern - Pseudo-random pattern fill and verify
# Tests pattern sensitivity with non-repeating LFSR sequence
Enable=1
Time (%)=50
Function=LFSRPattern
Pattern Mode=0
Pattern Param0=0xACE1ACE2DEADBEEF
Pattern Param1=0x0
Parameter=0
Test Block Size (Mb)=0

[Test15]
# MovingInversionLFSR - March test with LFSR pattern
# Combines moving inversion algorithm with pseudo-random data
Enable=1
Time (%)=1
Function=MovingInversionLFSR
Pattern Mode=0
Pattern Param0=0xACE1ACE2DEADBEEF
Pattern Param1=0x0
Parameter=50
Test Block Size (Mb)=0

[Test16]
# MovingInversionWalking - March test with walking-1 patterns
# Tests each bit position with forward/backward march and inversion
# Very thorough: 64 patterns x 2 phases per repeat
Enable=1
Time (%)=1
Function=MovingInversionWalking
Pattern Mode=0
Pattern Param0=0x0
Pattern Param1=0x0
Parameter=1
Test Block Size (Mb)=0

[Test17]
# Modulo20: keep every twentieth word unchanged while writing its peers.
# All twenty offsets and both polarities are checked, including the written peers.
Enable=1
Time (%)=1
Function=Modulo20
Pattern Mode=0
Pattern Param0=0xAAAAAAAAAAAAAAAA
Pattern Param1=0x0
Parameter=3
Test Block Size (Mb)=0
