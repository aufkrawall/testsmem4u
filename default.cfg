# testsmem4u Default Configuration
# Genuine memory stability workloads: patterns, transitions, moves, random access,
# retention under active memory testing, modulo coupling, and disturbance testing.
#
# Layout: short interleaved slices (TestMem5 style) instead of one long block per
# test. A marginal timing or voltage usually fails only under a particular kind of
# stress (row misses, read/write turnarounds, refresh under load, maximum toggling).
# Short slices reach every kind within the first ~20-45 minutes and keep coming
# back to it, and the heavy MirrorMove128 recurs every few entries to keep the
# DIMMs hot. Repeated entries of one test write new data at every occurrence.
#
# Runtime scales with memory size divided by memory bandwidth, not core count.
# Projection from a measured 64 MB run (Ryzen 7 5700X, DDR4, 16 threads): about
# 62 minutes per cycle at 28 GB, longest slice under 3 minutes; the log's
# "Time breakdown" and "Time by function" lines show the real split on your system.
#
# Time (%) is a loop weight, not a wall-clock percentage:
# max(1, Global Time(%) * Test Time(%) / 100) external invocations.
# Parameter controls each algorithm's internal repetitions or dwell time.
# Workers pull equal memory chunks; every chunk completes every enabled entry for
# at least Cycles cycles. Faster workers keep testing while slower ones finish.
# Sequence Start=staggered (or --sequence-start staggered) starts each chunk at a
# different entry so workers run different tests at the same time (opt-in).

[Main Section]
Config Name=Default Stability Test
Config Author=testsmem4u
Cores=0
Tests=19
Time (%)=100
Cycles=3
Language=-1
Sequence Start=aligned
# Test ID mapping:
#   0=SimpleTest(all-0),      1=SimpleTest(all-1),    2=SimpleTest(0xAA)
#   3=MovingInversion,        4=SimpleTest(linear),   5=SimpleTest(XOR)
#   6=WalkingOnes,            7=WalkingZeros,         8=MirrorMove
#   9=MirrorMove128,          10=BlockMove,           11=RefreshStable
#   12=RowHammer,             13=RandomAccess,        14=LFSRPattern
#   15=MovingInversionLFSR,   16=MovingInversionWalking, 17=Modulo20
#   18=SimpleTest(XOR, 4 MB blocks)
# Per cycle: MirrorMove128 x6, RandomAccess x3, RefreshStable x3, MirrorMove,
# BlockMove, MovingInversion, RowHammer, MovingInversionLFSR, Modulo20, XOR and
# 4 MB-block SimpleTest, LFSRPattern x2 each, everything else once.
Test Sequence=2,9,13,5,3,9,8,12,11,9,10,18,15,17,9,13,4,6,0,9,11,3,14,8,9,12,7,1,16,10,18,13,15,11,17,5,14

[Global Memory Setup]
Channels=2
Interleave Type=1
Single DIMM width, bits=64
Operation Block, byts=64
Testing Window Size (Mb)=0
Lock Memory Granularity (Mb)=16
# RAM left untested for the operating system (all platforms, at least 256 MB).
Reserved Memory for Windows (Mb)=512
Capable=0x0
Debug Level=1

# ============================================================================
# Streaming patterns (cheap: one fill + verify pass per loop)
# ============================================================================

[Test0]
# All-zeros
Enable=1
Time (%)=20
Function=SimpleTest
Pattern Mode=0
Pattern Param0=0x0
Pattern Param1=0x0
Parameter=0
Test Block Size (Mb)=0

[Test1]
# All-ones
Enable=1
Time (%)=20
Function=SimpleTest
Pattern Mode=0
Pattern Param0=0xFFFFFFFFFFFFFFFF
Pattern Param1=0x0
Parameter=0
Test Block Size (Mb)=0

[Test2]
# Alternating
Enable=1
Time (%)=20
Function=SimpleTest
Pattern Mode=0
Pattern Param0=0xAAAAAAAAAAAAAAAA
Pattern Param1=0x0
Parameter=0
Test Block Size (Mb)=0

[Test4]
# Linear Address
# Full-window address patterns avoid repeating the same pattern in every block.
Enable=1
Time (%)=50
Function=SimpleTest
Pattern Mode=2
Pattern Param0=0x12345678
Pattern Param1=0x9ABCDEF0
Parameter=0
Test Block Size (Mb)=0

[Test5]
# XOR Address (listed twice per cycle; each occurrence writes new data)
Enable=1
Time (%)=50
Function=SimpleTest
Pattern Mode=1
Pattern Param0=0xDEADBEEFCAFEBABE
Pattern Param1=0x7654321089ABCDEF
Parameter=0
Test Block Size (Mb)=0

[Test18]
# XOR Address on 4 MB blocks: 32 fill/verify repetitions per block before moving
# on, concentrating rapid rewrites on a few rows (TestMem5 presets rely heavily
# on small-block SimpleTests). Total work equals 32 whole-chunk passes.
Enable=1
Time (%)=1
Function=SimpleTest
Pattern Mode=1
Pattern Param0=0x0F1E2D3C4B5A6978
Pattern Param1=0x9E3779B97F4A7C15
Parameter=32
Test Block Size (Mb)=4

[Test14]
# LFSRPattern - Pseudo-random pattern fill and verify
Enable=1
Time (%)=50
Function=LFSRPattern
Pattern Mode=0
Pattern Param0=0xACE1ACE2DEADBEEF
Pattern Param1=0x0
Parameter=0
Test Block Size (Mb)=0

# ============================================================================
# Bit tests (one loop = all 64 bit positions)
# ============================================================================

[Test6]
# WalkingOnes
Enable=1
Time (%)=1
Function=WalkingOnes
Pattern Mode=0
Pattern Param0=0x0
Pattern Param1=0x0
Parameter=0
Test Block Size (Mb)=0

[Test7]
# WalkingZeros
Enable=1
Time (%)=1
Function=WalkingZeros
Pattern Mode=0
Pattern Param0=0x0
Pattern Param1=0x0
Parameter=0
Test Block Size (Mb)=0

# ============================================================================
# Moves and marches (read/write mixes, maximum toggling)
# ============================================================================

[Test9]
# MirrorMove128: the heaviest toggle/turnaround load; six slices per cycle.
Enable=1
Time (%)=1
Function=MirrorMove128
Pattern Mode=0
Pattern Param0=0x5555555555555555
Pattern Param1=0xAAAAAAAAAAAAAAAA
Parameter=40
Test Block Size (Mb)=0

[Test8]
# MirrorMove
Enable=1
Time (%)=1
Function=MirrorMove
Pattern Mode=0
Pattern Param0=0xF0F0F0F0F0F0F0F0
Pattern Param1=0x0F0F0F0F0F0F0F0F
Parameter=50
Test Block Size (Mb)=0

[Test10]
# BlockMove
Enable=1
Time (%)=50
Function=BlockMove
Pattern Mode=0
Pattern Param0=0xCCCC3333CCCC3333
Pattern Param1=0x0
Parameter=0
Test Block Size (Mb)=0

[Test3]
# MovingInversion (Standard)
Enable=1
Time (%)=1
Function=MovingInversion
Pattern Mode=0
Pattern Param0=0xAAAAAAAAAAAAAAAA
Pattern Param1=0x0
Parameter=40
Test Block Size (Mb)=0

[Test15]
# MovingInversionLFSR - March test with LFSR pattern
Enable=1
Time (%)=1
Function=MovingInversionLFSR
Pattern Mode=0
Pattern Param0=0xACE1ACE2DEADBEEF
Pattern Param1=0x0
Parameter=25
Test Block Size (Mb)=0

[Test16]
# MovingInversionWalking - March test with walking-1 patterns
# 64 patterns x 2 phases per repeat (Parameter=1 is the smallest unit).
Enable=1
Time (%)=1
Function=MovingInversionWalking
Pattern Mode=0
Pattern Param0=0x0
Pattern Param1=0x0
Parameter=1
Test Block Size (Mb)=0

# ============================================================================
# Row misses, retention and disturbance
# ============================================================================

[Test13]
# Random Access (row misses: activate/precharge timings); three slices per cycle.
# Parameter 1-100 = passes: 2 means 2 * (words per memory chunk) random accesses.
# Parameter >100 = explicit access count per memory chunk (101 means 101 accesses);
# the run logs a warning for such values.
Enable=1
Time (%)=1
Function=RandomAccess
Pattern Mode=0
Pattern Param0=0x0
Pattern Param1=0x0
Parameter=2
Test Block Size (Mb)=0

[Test11]
# RefreshStable; three slices per cycle (same total dwell as before: 12 x 10 s).
# Each half is held untouched for 10000ms per polarity while the other half
# executes real write/verify tests. Both halves rotate through both polarities.
# Tests both the configured pattern AND its bitwise complement for comprehensive
# DRAM retention coverage. Retention failures can be pattern-dependent.
Enable=1
Time (%)=1
Function=RefreshStable
Pattern Mode=0
Pattern Param0=0xFFFFFFFFFFFFFFFF
Pattern Param1=0x0
Parameter=10000
Test Block Size (Mb)=0

[Test12]
# RowHammer: Parameter = hammer points per GiB of the tested chunk (0 = 2048, i.e.
# 2 per MiB: about 19 minutes per chunk at 28 GB). Its physical activation rate is
# unverified, so it gets two short slices of 160 points per GiB (about 250 points,
# 1.5 minutes per chunk at 28 GB; at least one point per stride on tiny windows).
# Points are re-randomised every invocation.
Enable=1
Time (%)=1
Function=RowHammer
Pattern Mode=0
Pattern Param0=0x0
Pattern Param1=0x0
Parameter=160
Test Block Size (Mb)=0

[Test17]
# Modulo20: software never touches every twentieth word while writing its peers.
# Peers share its cache line, so DRAM rewrites it with its own (read-back) value.
# All twenty offsets and both polarities are checked, including the written peers.
Enable=1
Time (%)=1
Function=Modulo20
Pattern Mode=0
Pattern Param0=0xAAAAAAAAAAAAAAAA
Pattern Param1=0x0
Parameter=1
Test Block Size (Mb)=0
