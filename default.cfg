# ============================================================================
# PHASE 6: Retention & Physical
# ============================================================================

[Test11]
# RefreshStable
# Tests both the configured pattern AND its bitwise complement for comprehensive
# DRAM retention coverage. Retention failures can be pattern-dependent.
# 3 external loops x (write + 10000ms delay + verify + write + 10000ms + verify)
# favors longer retention windows.
Enable=1
Time (%)=3
Function=RefreshStable
Pattern Mode=0
Pattern Param0=0xFFFFFFFFFFFFFFFF
Pattern Param1=0x0
Parameter=10000
Test Block Size (Mb)=0

[Test12]
# RowHammer (~5-10 min @ 25GB, scales with region size; runtime sweeps common row strides)
Enable=1
Time (%)=1
Function=RowHammer
Pattern Mode=0
Pattern Param0=0x0
Pattern Param1=0x0
Parameter=0
Test Block Size (Mb)=0

